[project]
name = "voice_agent_core"
version = "0.1.0"
description = "Core — A highly capable AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
]

[project.scripts]
start = "server:main"
agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
